name: CI

# Gates required by the accepted decisions:
#   D16 / G1 — mypy --strict fails the build; dependency vulnerability scanning.
#   D19 / G4 — PostgreSQL only; no other datastore appears in this workflow.

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy --strict
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: adw_owner
          POSTGRES_PASSWORD: adw_ci_password
          POSTGRES_DB: adw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adw_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADW_APP_ENV: test
      ADW_DATABASE_URL: postgresql+psycopg://adw_owner:adw_ci_password@localhost:5432/adw_test
      ADW_TEST_DATABASE_URL: postgresql+psycopg://adw_owner:adw_ci_password@localhost:5432/adw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit and integration tests
        run: pytest -v
      - name: Alembic can reach the database
        run: alembic current

  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --strict --progress-spinner off
