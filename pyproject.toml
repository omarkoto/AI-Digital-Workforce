[project]
name = "adw"
version = "0.1.0"
description = "AI Digital Workforce — Execution Record Core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.34,<0.40",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    # RFC 8785 JSON Canonicalization (D23). Trail of Bits, Apache-2.0, pure
    # Python, no transitive dependencies, ships py.typed. Deliberately not
    # implemented in-house: this sits directly under the audit chain.
    "rfc8785>=0.1.4,<0.2",
    # Authenticated encryption for audit payloads (D1, D25). The chain stores
    # ciphertext and hashes its digest, never plaintext (I12), so a tenant key
    # can be destroyed without making the chain unverifiable.
    "cryptography>=44,<47",
    # HTTP client for the Ollama Cloud provider (D8). Runtime, not dev-only:
    # the real provider adapter imports it. Chosen for an explicit, mandatory
    # timeout on every request — CLAUDE.md §4 requires one on every tool call.
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<8",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.15",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Type checking — G1: mypy --strict fails the build.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
# Every `type: ignore` must name the code it suppresses, so suppressions stay auditable.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit — security
    "DTZ",  # flake8-datetimez — supports G6: no naive host clocks
    "T20",  # no print()
    "RUF",
]
ignore = [
    "S101",  # assert is expected in tests; see per-file ignores for the rest
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hard-coded test credentials are fine in tests
# The isolation suite composes DDL and DML around a table name that is a module
# constant, never caller input. Parameter binding is used for every value; only
# the identifier is interpolated, which SQL has no placeholder for.
"tests/security/**" = ["S105", "S106", "S608"]
# Migrations compose DDL, policies, and grants around table names that are
# module constants, never caller input. SQL has no placeholder for an identifier.
"migrations/**" = ["S608"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: no external dependencies",
    "integration: requires a live PostgreSQL database",
    "security: isolation, privilege, and redaction guarantees",
    "scenario: end-to-end execution record proof",
    "external: requires network access and real provider credentials; never runs in CI",
]
